name: Release

# Pushing a tag "vX.Y.Z" publishes version X.Y.Z on PyPI and creates its GitHub release.
# Running the workflow by hand publishes the current branch on TestPyPI instead (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the package version
        id: version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('faker_literature/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the tag and the changelog
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - <date>' section"
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish on TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/faker-literature/
    permissions:
      id-token: write  # Trusted Publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run may be repeated for the same version
          skip-existing: true

  pypi:
    name: Publish on PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faker-literature/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "faker-literature $VERSION" --notes-file notes.md --verify-tag
